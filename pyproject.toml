[project]
name = "highway-abandon-detect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentationsx[headless]>=2.5.1",
    "datasets>=5.1.0",
    "lightning>=2.6.6",
    "loguru>=0.7.3",
    "matplotlib>=3.9",
    "omegaconf>=2.4.0",
    "pycocotools>=2.0.8",
    "pydantic>=2,<3",
    "pytorch-lightning>=2.6.6",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "swanlab>=0.10.5",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
    "transformers>=5.20.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
