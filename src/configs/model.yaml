seed: 42 # 随机种子
model:
  pretrain_model: "facebook/dinov3-vitb16-pretrain-lvd1689m"
  patch_size: 16
  out_indices: [3, 6, 9, 12] # Dinov3输出的特征图层数
  projector_scale: ["P3", "P4", "P5"]
  project_hidden_dim: 256 # projector输出的维度
  # hidden_size: 769
  num_classes: 1 # 分类任务的类别数
  num_queries: 100 # 解码器输入query的数量
  two_stage: true # 是否开启两阶段Detr

train_config:
  batch_size: 16
  epochs: 100
  num_workers: 4
  learning_rate: 0.001
  optimizer: Adam
  loss: MSE
  multi_scale: true
  scale_sizes: [768, 960, 1152]
  fix_scale_size: 960
logger:
  level: "DEBUG" # 终端最低级别。
  file_level: "DEBUG" # 文件保留更详细的调试信息。
  console_enabled: true
  file_enabled: true
  log_dir: "logs" # 相对于项目根目录。
  colorize: true # 终端支持颜色时启用，文件始终不包含颜色控制符。
  rotation: "50 MB" # 单个文件达到阈值后轮转。
  retention: "14 days" # 轮转时清理超出期限的旧日志。
  compression: "zip"
  enqueue: true # 队列写入，减少日志 I/O 对训练调用的阻塞。
  backtrace: true
  diagnose: false # 异常中不展开变量值，避免输出大量张量。
  serialize: false # true 时文件输出为 JSON，终端仍为可读文本。
